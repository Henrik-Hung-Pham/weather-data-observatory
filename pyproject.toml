[project]
name = "data-observatory"
version = "1.0.0"
description = "Self-Healing Data Observatory - End-to-End Data Quality Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Data Engineer", email = "engineer@example.com"}
]
keywords = ["data-quality", "etl", "data-pipeline", "great-expectations", "medallion-architecture"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "great-expectations>=0.18.0,<1.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "boto3>=1.34.0",
    "streamlit>=1.30.0",
    "python-dotenv>=1.0.0",
    "schedule>=1.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "moto>=5.0.0",
    "httpx>=0.26.0",
]
orchestration = [
    "dagster>=1.6,<2.0",
    "dagster-webserver>=1.6,<2.0",
]

[project.scripts]
observatory = "data_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["data_pipeline*", "dashboard*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

# Dagster is an optional extra (see [project.optional-dependencies].orchestration)
# and is intentionally not installed in the lint/CI environment. There its types
# resolve to Any, so its decorators (e.g. @asset) are seen as untyped. Relax the
# untyped-decorator rule for the orchestration module so mypy passes with or
# without Dagster installed.
[[tool.mypy.overrides]]
module = "data_pipeline.orchestration.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["data_pipeline"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]
