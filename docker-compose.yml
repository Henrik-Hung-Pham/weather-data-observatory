services:
  # =============================================================================
  # Infrastructure Services
  # =============================================================================

  postgres:
    image: postgres:15-alpine
    container_name: observatory-postgres
    environment:
      POSTGRES_DB: observatory
      POSTGRES_USER: observatory
      POSTGRES_PASSWORD: observatory_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U observatory -d observatory" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - observatory-network

  localstack:
    image: localstack/localstack:3.0
    container_name: observatory-localstack
    environment:
      SERVICES: s3
      DEBUG: 0
      DATA_DIR: /var/lib/localstack/data
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./infra/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4566/_localstack/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - observatory-network

  # =============================================================================
  # Application Services
  # =============================================================================

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: observatory-pipeline
    environment:
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=observatory
      - POSTGRES_USER=observatory
      - POSTGRES_PASSWORD=observatory_secret
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - S3_BUCKET_NAME=data-observatory
      - QUALITY_GATE_MODE=block
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - observatory-network
    # The pipeline is a batch job: `python -m data_pipeline.pipeline` runs
    # once and exits. `restart: unless-stopped` therefore restarted it
    # immediately, forever -- a tight loop against the OpenWeather free tier.
    # Run it once per `docker-compose up`; re-run on demand with
    # `docker-compose run --rm pipeline`. For scheduled runs use the Dagster
    # orchestration layer (see data_pipeline/orchestration/definitions.py),
    # which is what owns scheduling in this project.
    restart: "no"

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: dashboard
    container_name: observatory-dashboard
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=observatory
      - POSTGRES_USER=observatory
      - POSTGRES_PASSWORD=observatory_secret
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - S3_BUCKET_NAME=data-observatory
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - observatory-network
    restart: unless-stopped

volumes:
  postgres_data:
  localstack_data:


networks:
  observatory-network:
    driver: bridge
