name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full scan so newly-disclosed CVEs surface even without a push.
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  dependency-audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    # Blocking. This was advisory "while the dependency set is being
    # modernised"; that modernisation is done -- the lock is regenerated from
    # the current requirements.txt and `pip-audit -r requirements.lock
    # --strict` reports no known vulnerabilities, so the gate can hold.
    #
    # A failure here usually means a new CVE was published against a pinned
    # version, not that the PR is wrong -- and it will fail on every open PR
    # at once. Fix it by bumping the affected package and regenerating the
    # lock (see README, "Regenerating the lock file"). Do not re-add
    # continue-on-error to get back to green.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit pinned lock file
        run: pip-audit -r requirements.lock --strict

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install bandit
        run: python -m pip install --upgrade pip bandit
      - name: Run bandit (medium+ severity/confidence)
        run: bandit -r data_pipeline dashboard -ll -ii

  filesystem-scan:
    name: Filesystem Scan (trivy)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
