name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing exchanges this OIDC token for a short-lived
      # Sigstore certificate -- no long-lived signing key to store or rotate.
      id-token: write
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      
      - name: Build and push Pipeline image
        id: build-pipeline
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attach an SBOM and full SLSA provenance to the pushed image, so
          # "what is actually in this image, and what built it" is answerable
          # from the registry rather than by guessing from the Dockerfile.
          sbom: true
          provenance: mode=max
      
      - name: Extract dashboard metadata
        id: meta-dashboard
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-dashboard
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Dashboard image
        id: build-dashboard
        uses: docker/build-push-action@v7
        with:
          context: .
          target: dashboard
          push: true
          tags: ${{ steps.meta-dashboard.outputs.tags }}
          labels: ${{ steps.meta-dashboard.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.10.0

      # Sign by digest, not by tag: a tag can be repointed after signing,
      # a digest cannot. One signature covers every tag metadata-action
      # produced for that build.
      - name: Sign the pushed images
        env:
          PIPELINE_DIGEST: ${{ steps.build-pipeline.outputs.digest }}
          DASHBOARD_DIGEST: ${{ steps.build-dashboard.outputs.digest }}
        run: |
          set -euo pipefail
          # Image names must be lowercase: IMAGE_NAME carries the owner's
          # original casing (github.repository) and ghcr.io rejects uppercase.
          pipeline_image=$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          dashboard_image="${pipeline_image}-dashboard"

          cosign sign --yes "${pipeline_image}@${PIPELINE_DIGEST}"
          cosign sign --yes "${dashboard_image}@${DASHBOARD_DIGEST}"

          echo "Signed:"
          echo "  ${pipeline_image}@${PIPELINE_DIGEST}"
          echo "  ${dashboard_image}@${DASHBOARD_DIGEST}"

  validate-infrastructure:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.6"
      
      - name: Terraform Format Check
        run: |
          if [ -d "infra/terraform" ]; then
            cd infra/terraform
            terraform fmt -check -recursive
          else
            echo "No Terraform configuration found, skipping..."
          fi
      
      - name: Terraform Validate
        run: |
          if [ -d "infra/terraform" ]; then
            cd infra/terraform
            terraform init -backend=false
            terraform validate
          else
            echo "No Terraform configuration found, skipping..."
          fi

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push, validate-infrastructure]
    environment:
      name: staging
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Deploy notification
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          # Add your deployment commands here
          # e.g., kubectl, aws ecs update-service, etc.

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Deploy notification
        run: |
          echo "🚀 Deploying to production environment..."
          echo "Tag: ${{ github.ref_name }}"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          # Add your production deployment commands here
