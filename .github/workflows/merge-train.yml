name: PR Merge Train

# Replaces the claude.ai scheduled routine, which silently dropped its fires
# (2026-08-17 failed; 2026-09-04 never started at all — no run session, no
# error, nothing in issue #31). GitHub's scheduler runs where the PRs already
# live and fails visibly: a missed or broken run is a red entry in the Actions
# tab rather than silence.
on:
  schedule:
    # 06:30 UTC on weekdays == 09:30 Europe/Helsinki while EEST holds, and
    # 08:30 after DST ends 2026-10-25. GitHub cron is always UTC.
    #
    # Note: GitHub delays scheduled runs under load, sometimes by 10+ minutes,
    # and may skip them entirely on repos with no recent activity. That is
    # documented behaviour, not a fault — but it is why the run reports to
    # issue #31 every time, so a missing report is detectable.
    - cron: "30 6 * * 1-5"
  workflow_dispatch:

# Never let two merge trains overlap — both would try to merge a PR.
concurrency:
  group: merge-train
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  merge-train:
    name: Merge one PR and unblock the rest
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the run compares branches with `git merge-tree`.
          fetch-depth: 0
          # Prefer MERGE_TRAIN_TOKEN (a PAT) when present. Pushes made with
          # the default GITHUB_TOKEN do NOT trigger the CI workflow, so
          # without a PAT the run cannot wait for a branch to go green.
          token: ${{ secrets.MERGE_TRAIN_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install the quality gates
        # The run executes these four gates locally before pushing any
        # conflict resolution, exactly as the prompt requires. 3.11 here
        # matches CI, so requirements.lock can also be regenerated properly.
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov pip-tools
          pip install -r requirements.txt

      - name: Identify as the merge train
        run: |
          git config user.name  "pr-merge-train[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run the merge train
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.MERGE_TRAIN_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-opus-5
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
          prompt: |
            You are maintaining the GitHub repository Henrik-Hung-Pham/weather-data-observatory, which is checked out for you in the working directory. This runs once per weekday morning. Do one day's worth of work, then stop.

            Goal for this run: merge exactly ONE open pull request into `main`, leave EVERY remaining open PR conflict-free and green, and log what you did to issue #31.

            1. INVENTORY. `git fetch --all --prune`, then `gh pr list --state open --json number,title,createdAt,mergeable,mergeStateStatus,headRefName`. If there are no open PRs, post a final comment on issue #31 saying the merge train is done, and stop without doing anything else.

            2. FIX RED BUILDS — all of them, not just the PR you plan to merge. For every open PR with failing checks, inspect the failure (`gh pr checks <n>`, `gh run view --job <job-id> --log-failed`), diagnose the real cause, and push a fix to that PR's branch. Fix the underlying problem. Do NOT delete or skip tests, loosen lint rules, lower coverage floors, add ignore/noqa pragmas, or weaken a CI gate to turn a build green. If a failure genuinely cannot be fixed in this run, leave a comment on that PR describing what is broken and move on.

               Note: a `pip-audit` failure on `requirements.lock` usually means new CVEs were published against pinned versions, not that anything in the PR is wrong — it will fail on every open PR at once. Fix it by bumping the affected packages to their fixed versions. The lock is generated by `pip-compile --generate-hashes --output-file=requirements.lock --strip-extras requirements.txt` under Python 3.11. This runner has 3.11 and pip-tools installed, so regenerate the lock properly rather than hand-patching hashes.

            3. CHOOSE TODAY'S PR. Among open PRs that are green and MERGEABLE, pick the single safest one to land now. Prefer the PR that other open PRs most likely depend on, and the one whose merge will create the fewest conflicts for the rest. To judge that, test each candidate with `git merge-tree --write-tree main <branch>` and check whether merging it would introduce new conflicts for the PRs that are already conflicting. State your reasoning in one or two sentences.

            4. VERIFY THE GREEN IS REAL — do not skip this. `gh pr checks` reports the result of the last run, which may have executed against a stale base. A branch cut before the CI tightening in #17 can show a green tick from a run that never applied the current gates (whole-repo ruff, mypy over `dashboard/`, the coverage floor, and the entire security workflow). Before merging, confirm the PR's checks ran on a commit that already contains current `main` — compare the check run's head SHA against `main`, and count the checks: a current run has the full set, an old one is visibly short. If the run is stale, merge `origin/main` into the PR branch, run the four gates locally (`ruff check .`, `ruff format --check .`, `mypy data_pipeline/ dashboard/`, `pytest tests/unit/ --cov=data_pipeline`), push, and wait for CI to go green on the real base before merging.

            5. MERGE IT. Squash-merge into main and delete the branch: `gh pr merge <n> --squash --delete-branch`. Merge only if checks are green and mergeable is MERGEABLE. Never pass --admin and never bypass a required check or branch protection. If no PR is both green and mergeable, skip the merge for today and say so clearly.

            6. RESOLVE EVERY REMAINING CONFLICT. This is a required step, not a best-effort one, and it is the step most likely to be skipped — do not skip it. Conflicts left alone compound: four PRs on this repo once sat unresolved across three consecutive runs and blocked the train.

               After the merge, test every remaining open PR against the updated `main` with `git merge-tree --write-tree --name-only main <branch>`, which reports conflicts without touching your working tree. For each PR that conflicts:

               - Check out the PR branch and merge `origin/main` into it. Do NOT rebase and force-push — merging preserves the branch's CI history and avoids rewriting a shared branch.
               - Read enough of both sides to understand what each change was actually for before you resolve anything. Then write a resolution that preserves both intents. Do not take one side wholesale to make the conflict disappear, and do not silently drop a hunk you find confusing.
               - Run the four gates locally on the resolved branch (`ruff check .`, `ruff format --check .`, `mypy data_pipeline/ dashboard/`, `pytest tests/unit/ --cov=data_pipeline`) before pushing.
               - Push, and let CI re-run.

               Work through every conflicting PR, not just the first one or two. You may leave a conflict unresolved ONLY if resolving it would require inventing behaviour that neither side specifies. That bar is high and is rarely met; "this is intricate" or "this touches several files" does not meet it. If you do leave one, comment on that PR quoting the exact conflicting hunks and stating precisely what is ambiguous, and report it in step 7.

            7. REPORT — always do this, even if you merged nothing or hit errors. Post a comment on issue #31 using `gh issue comment 31 --body-file <file>` with today's date as a heading and these sections:
               - **Merged:** which PR (number + title) and one sentence on why you chose it, or "none" plus the reason.
               - **Stale-green check:** what you found in step 4 and what you did about it.
               - **Red builds fixed:** each PR, what was failing, and what you changed. "none" if all were green.
               - **Conflicts resolved:** every PR you touched in step 6, the files that conflicted, and how you resolved each — specifically enough that a reviewer can check your judgement. Then list any conflicting PR you did NOT resolve, with the reason.
               - **Needs a human:** anything you skipped, could not fix, or were unsure about. Be explicit; do not soften this section.
               - **Remaining:** count and list of still-open PRs, and which of them still conflict.

               End the comment with a line naming this workflow run so the log is traceable:
               "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

               Report honestly — if something failed or you skipped a step, say so plainly rather than presenting a clean summary.

            HARD CONSTRAINTS: never force-push to `main`; never close a PR; never merge more than one PR per run; never merge a PR whose checks are failing; never close issue #31.
