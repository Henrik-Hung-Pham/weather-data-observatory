name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -r requirements.txt
      
      # Lint everything we ship or test. Checking only data_pipeline/ left
      # about a third of the codebase unlinted: dashboard/ and tests/ had 147
      # ruff violations and dashboard/app.py 8 mypy errors, none of them
      # visible in CI.
      - name: Run Ruff (linting)
        run: ruff check data_pipeline/ tests/ dashboard/

      - name: Run Ruff (formatting)
        run: ruff format --check data_pipeline/ tests/ dashboard/

      # mypy covers the shipped code. tests/ is deliberately excluded for
      # now -- see the PR notes: doing it properly needs the DI seams
      # expressed as Protocols, which is a production type change.
      - name: Run MyPy (type checking)
        # ignore_missing_imports is configured in pyproject.toml so this matches
        # local runs exactly.
        run: mypy data_pipeline/ dashboard/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Unit Tests
        # --cov-fail-under is a ratchet, not a target: it stops coverage
        # sliding backwards. Raise it when a change earns the increase.
        run: |
          pytest tests/unit/ -v \
            --cov=data_pipeline \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=64
        env:
          OPENWEATHER_API_KEY: "test_key"
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: observatory
          POSTGRES_PASSWORD: observatory_secret
          POSTGRES_DB: observatory
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      localstack:
        image: localstack/localstack:3.0
        ports:
          - 4566:4566
        env:
          SERVICES: s3
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Wait for services
        run: |
          # Wait for LocalStack — s3 reports "available" in LocalStack Community
          # and transitions to "running" only after first use. Accept either.
          if ! timeout 120 bash -c 'until curl -fsS http://localhost:4566/_localstack/health | grep -qE "\"s3\": \"(available|running)\""; do sleep 2; done'; then
            echo "LocalStack s3 did not become ready in 120s. Last health response:"
            curl -fsS http://localhost:4566/_localstack/health || true
            exit 1
          fi
          # Wait for PostgreSQL
          timeout 30 bash -c 'until pg_isready -h localhost -p 5432 -U observatory; do sleep 1; done'
      
      - name: Initialize S3 bucket
        run: |
          pip install awscli-local
          awslocal s3 mb s3://data-observatory
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
      
      - name: Initialize database schema
        run: |
          PGPASSWORD=observatory_secret psql -h localhost -U observatory -d observatory -f sql/schema.sql
      
      - name: Run Integration Tests
        # The services above are provisioned, so an unreachable service must
        # fail the job. Without REQUIRE_INTEGRATION_SERVICES the suite skips
        # when it cannot connect, which would let this job pass green while
        # testing nothing -- exactly the state it was in before.
        #
        # Coverage is scoped to data_pipeline.storage: these tests exist
        # specifically to cover the S3 and SQL code the unit suite cannot.
        # 68% is the measured figure with the services up -- database.py alone
        # was at 13% before these tests existed. Ratchet it, don't chase it:
        # initialize_schema and most error branches remain uncovered.
        run: |
          pytest tests/integration/ -v \
            --cov=data_pipeline.storage \
            --cov-report=term-missing \
            --cov-fail-under=68
        env:
          REQUIRE_INTEGRATION_SERVICES: "1"
          OPENWEATHER_API_KEY: "test_key"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: observatory
          POSTGRES_USER: observatory
          POSTGRES_PASSWORD: observatory_secret
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          S3_BUCKET_NAME: data-observatory

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: data-observatory:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker image
        run: |
          docker run --rm data-observatory:test python -c "from data_pipeline import __version__; print(__version__)"

  data-quality-check:
    name: Data Quality Validation
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Quality Gate Configuration Check
        run: |
          python -c "
          from data_pipeline.quality.gates import build_gate_for_layer

          # Verify the standard per-layer gates assemble for every layer.
          for layer in ('bronze', 'silver', 'gold'):
              gate = build_gate_for_layer(layer, mode='block')
              assert gate.gate_name == f'{layer}_quality_gate'
              assert gate._rules, f'{layer} gate has no rules'
              print(f'✓ {gate.gate_name}: {len(gate._rules)} rule(s), mode={gate.mode}')
          print('Quality gate configuration is valid!')
          "
        env:
          OPENWEATHER_API_KEY: "test_key"
